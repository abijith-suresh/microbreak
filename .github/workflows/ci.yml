name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@e2088a6610d40b7c978e6e8e7ca3272be8d06020 # v0.4.0
    permissions:
      contents: read
