name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@b42be9571985efb1ce10970340250fcccc657050 # Release Please v0.1.0
    with:
      working-directory: .
      verify-command: bun run verify
    permissions:
      contents: read
