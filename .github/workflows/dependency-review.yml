name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@e2088a6610d40b7c978e6e8e7ca3272be8d06020 # Release Please v0.4.0
    with:
      fail-on-severity: high
    permissions:
      contents: read
